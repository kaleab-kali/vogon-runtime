name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  linux-cli:
    name: Linux CLI artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test CLI artifact
        run: |
          ./target/release/vogon --version
          ./target/release/vogon verify fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json

      - name: Package CLI artifact
        run: |
          mkdir -p dist
          cp target/release/vogon dist/vogon
          tar -C dist -czf "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" vogon

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" --title "${{ github.ref_name }}" --generate-notes
