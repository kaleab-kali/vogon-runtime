name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-cli:
    name: Linux CLI artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test CLI artifact
        run: |
          ./target/release/vogon --version
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            ./target/release/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Package CLI artifact
        run: |
          mkdir -p dist
          cp target/release/vogon dist/vogon
          tar -C dist -czf "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" vogon

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: vogon-linux-x86_64
          path: vogon-${{ github.ref_name }}-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-cli:
    name: Windows CLI artifact
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test CLI artifact
        run: |
          .\target\release\vogon.exe --version
          Get-ChildItem fixtures\replays\*.replay.json | ForEach-Object {
            $name = $_.Name -replace '\.replay\.json$', ''
            .\target\release\vogon.exe verify "fixtures\workflows\$name.toml" $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Package CLI artifact
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\vogon.exe dist\vogon.exe
          Compress-Archive -Path dist\vogon.exe -DestinationPath "vogon-${{ github.ref_name }}-windows-x86_64.zip" -Force

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: vogon-windows-x86_64
          path: vogon-${{ github.ref_name }}-windows-x86_64.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - linux-cli
      - windows-cli

    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/**/vogon-* --title "${{ github.ref_name }}" --generate-notes
