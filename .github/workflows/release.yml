name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: 10

jobs:
  linux-cli:
    name: Linux CLI artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test CLI artifact
        run: |
          ./target/release/vogon --version
          doctor_json="$(./target/release/vogon doctor --json)"
          echo "$doctor_json"
          printf '%s\n' "$doctor_json" | cargo run -p vogon-xtask -- check-doctor-json
          providers_json="$(./target/release/vogon providers --json)"
          echo "$providers_json"
          printf '%s\n' "$providers_json" | cargo run -p vogon-xtask -- check-providers-json
          init_workflow="$RUNNER_TEMP/vogon-init-smoke.toml"
          ./target/release/vogon init --force --output "$init_workflow"
          init_check_json="$(./target/release/vogon check --json "$init_workflow")"
          echo "$init_check_json"
          printf '%s\n' "$init_check_json" | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
          check_json="$(./target/release/vogon check --json fixtures/workflows/support-triage.toml)"
          echo "$check_json"
          printf '%s\n' "$check_json" | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name support-triage --expected-step-count 2
          verify_json="$(./target/release/vogon verify --json fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json)"
          echo "$verify_json"
          printf '%s\n' "$verify_json" | cargo run -p vogon-xtask -- check-verify-json --expected-workflow-name support-triage --expect-match
          trace_jsonl="$(./target/release/vogon trace --jsonl fixtures/replays/support-triage.replay.json)"
          echo "$trace_jsonl"
          printf '%s\n' "$trace_jsonl" | python3 scripts/check_trace_jsonl.py --expected-provider deterministic --expected-model deterministic-echo --expected-step-count 2
          cache_file="$RUNNER_TEMP/vogon-cache-smoke.cache.json"
          ./target/release/vogon run --cache-file "$cache_file" --cache-max-entries 1 fixtures/workflows/support-triage.toml > "$RUNNER_TEMP/vogon-cache-smoke.replay.json"
          python3 scripts/check_cache_json.py "$cache_file" --expected-max-entries 1 --expected-entry-count 1
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            ./target/release/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Package CLI artifact
        run: |
          mkdir -p dist
          cp target/release/vogon dist/vogon
          cp README.md LICENSE dist/
          tar -C dist -czf "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" vogon README.md LICENSE
          sha256sum "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" > "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256"
          cargo run -p vogon-xtask -- check-sha256-file "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz"

      - name: Write dependency metadata
        run: |
          cargo metadata --locked --format-version 1 > "vogon-${{ github.ref_name }}-cargo-metadata.json"
          cargo run -p vogon-xtask -- check-cargo-metadata-json "vogon-${{ github.ref_name }}-cargo-metadata.json" --expected-workspace-package vogon-core --expected-workspace-package vogon-adapters --expected-workspace-package vogon-cli
          sha256sum "vogon-${{ github.ref_name }}-cargo-metadata.json" > "vogon-${{ github.ref_name }}-cargo-metadata.json.sha256"
          cargo run -p vogon-xtask -- check-sha256-file "vogon-${{ github.ref_name }}-cargo-metadata.json"

      - name: Write SPDX SBOM
        run: |
          python3 scripts/write_spdx_sbom.py \
            --metadata "vogon-${{ github.ref_name }}-cargo-metadata.json" \
            --output "vogon-${{ github.ref_name }}-cargo-spdx.json" \
            --document-name "vogon-runtime ${{ github.ref_name }}" \
            --namespace "https://github.com/kaleab-kali/vogon-runtime/releases/${{ github.ref_name }}/sbom/${{ github.run_id }}"
          sha256sum "vogon-${{ github.ref_name }}-cargo-spdx.json" > "vogon-${{ github.ref_name }}-cargo-spdx.json.sha256"
          cargo run -p vogon-xtask -- check-sha256-file "vogon-${{ github.ref_name }}-cargo-spdx.json"
          python3 scripts/check_spdx_sbom_json.py "vogon-${{ github.ref_name }}-cargo-spdx.json" --expected-name "vogon-runtime ${{ github.ref_name }}" --expected-package vogon-runtime-source --expected-package vogon-core --expected-package vogon-adapters --expected-package vogon-cli

      - name: Smoke test packaged archive
        run: |
          mkdir -p archive-smoke
          tar -xzf "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" -C archive-smoke
          cargo run -p vogon-xtask -- check-archive-contents archive-smoke --binary vogon
          ./archive-smoke/vogon --version
          ./archive-smoke/vogon doctor --json | cargo run -p vogon-xtask -- check-doctor-json
          ./archive-smoke/vogon providers --json | cargo run -p vogon-xtask -- check-providers-json
          ./archive-smoke/vogon init --force --output archive-smoke/starter.toml
          ./archive-smoke/vogon check --json archive-smoke/starter.toml | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
          ./archive-smoke/vogon run --cache-file archive-smoke/cache-smoke.cache.json --cache-max-entries 1 fixtures/workflows/support-triage.toml > archive-smoke/cache-smoke.replay.json
          python3 scripts/check_cache_json.py archive-smoke/cache-smoke.cache.json --expected-max-entries 1 --expected-entry-count 1

      - name: Attest CLI archive
        uses: actions/attest@v4
        with:
          subject-path: vogon-${{ github.ref_name }}-linux-x86_64.tar.gz

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: vogon-linux-x86_64
          path: |
            vogon-${{ github.ref_name }}-linux-x86_64.tar.gz
            vogon-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
            vogon-${{ github.ref_name }}-cargo-metadata.json
            vogon-${{ github.ref_name }}-cargo-metadata.json.sha256
            vogon-${{ github.ref_name }}-cargo-spdx.json
            vogon-${{ github.ref_name }}-cargo-spdx.json.sha256
          if-no-files-found: error
          retention-days: 30

  windows-cli:
    name: Windows CLI artifact
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test CLI artifact
        run: |
          .\target\release\vogon.exe --version
          $doctorJson = (& .\target\release\vogon.exe doctor --json) -join "`n"
          $doctorJson
          $doctorJson | cargo run -p vogon-xtask -- check-doctor-json
          $providersJson = (& .\target\release\vogon.exe providers --json) -join "`n"
          $providersJson
          $providersJson | cargo run -p vogon-xtask -- check-providers-json
          $initWorkflow = Join-Path $env:RUNNER_TEMP 'vogon-init-smoke.toml'
          .\target\release\vogon.exe init --force --output $initWorkflow
          $initCheckJson = (& .\target\release\vogon.exe check --json $initWorkflow) -join "`n"
          $initCheckJson
          $initCheckJson | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
          $checkJson = (& .\target\release\vogon.exe check --json fixtures\workflows\support-triage.toml) -join "`n"
          $checkJson
          $checkJson | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name support-triage --expected-step-count 2
          $verifyJson = (& .\target\release\vogon.exe verify --json fixtures\workflows\support-triage.toml fixtures\replays\support-triage.replay.json) -join "`n"
          $verifyJson
          $verifyJson | cargo run -p vogon-xtask -- check-verify-json --expected-workflow-name support-triage --expect-match
          $traceJsonl = (& .\target\release\vogon.exe trace --jsonl fixtures\replays\support-triage.replay.json) -join "`n"
          $traceJsonl
          $traceJsonl | python scripts\check_trace_jsonl.py --expected-provider deterministic --expected-model deterministic-echo --expected-step-count 2
          $cacheFile = Join-Path $env:RUNNER_TEMP 'vogon-cache-smoke.cache.json'
          .\target\release\vogon.exe run --cache-file $cacheFile --cache-max-entries 1 fixtures\workflows\support-triage.toml | Out-Null
          python scripts\check_cache_json.py $cacheFile --expected-max-entries 1 --expected-entry-count 1
          Get-ChildItem fixtures\replays\*.replay.json | ForEach-Object {
            $name = $_.Name -replace '\.replay\.json$', ''
            .\target\release\vogon.exe verify "fixtures\workflows\$name.toml" $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Package CLI artifact
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\vogon.exe dist\vogon.exe
          Copy-Item README.md, LICENSE dist\
          Compress-Archive -Path dist\vogon.exe, dist\README.md, dist\LICENSE -DestinationPath "vogon-${{ github.ref_name }}-windows-x86_64.zip" -Force
          $hash = Get-FileHash -Algorithm SHA256 "vogon-${{ github.ref_name }}-windows-x86_64.zip"
          "$($hash.Hash.ToLowerInvariant())  vogon-${{ github.ref_name }}-windows-x86_64.zip" | Set-Content "vogon-${{ github.ref_name }}-windows-x86_64.zip.sha256" -NoNewline
          cargo run -p vogon-xtask -- check-sha256-file "vogon-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Smoke test packaged archive
        run: |
          Expand-Archive "vogon-${{ github.ref_name }}-windows-x86_64.zip" -DestinationPath archive-smoke -Force
          cargo run -p vogon-xtask -- check-archive-contents archive-smoke --binary vogon.exe
          .\archive-smoke\vogon.exe --version
          $archiveDoctorJson = (& .\archive-smoke\vogon.exe doctor --json) -join "`n"
          $archiveDoctorJson | cargo run -p vogon-xtask -- check-doctor-json
          $archiveProvidersJson = (& .\archive-smoke\vogon.exe providers --json) -join "`n"
          $archiveProvidersJson | cargo run -p vogon-xtask -- check-providers-json
          .\archive-smoke\vogon.exe init --force --output archive-smoke\starter.toml
          .\archive-smoke\vogon.exe check --json archive-smoke\starter.toml | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
          .\archive-smoke\vogon.exe run --cache-file archive-smoke\cache-smoke.cache.json --cache-max-entries 1 fixtures\workflows\support-triage.toml | Out-Null
          python scripts\check_cache_json.py archive-smoke\cache-smoke.cache.json --expected-max-entries 1 --expected-entry-count 1

      - name: Attest CLI archive
        uses: actions/attest@v4
        with:
          subject-path: vogon-${{ github.ref_name }}-windows-x86_64.zip

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: vogon-windows-x86_64
          path: |
            vogon-${{ github.ref_name }}-windows-x86_64.zip
            vogon-${{ github.ref_name }}-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  container-image:
    name: Container image artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build container image
        run: |
          docker build \
            --build-arg "VOGON_IMAGE_VERSION=${{ github.ref_name }}" \
            --build-arg "VOGON_IMAGE_REVISION=${{ github.sha }}" \
            --tag "vogon-runtime:${{ github.ref_name }}" \
            .

      - name: Smoke test container image
        run: |
          image="vogon-runtime:${{ github.ref_name }}"
          python3 scripts/check_container_image.py "$image" --expected-version "${{ github.ref_name }}" --expected-revision "${{ github.sha }}"
          docker run --rm "$image" --version
          docker run --rm --read-only "$image" --version
          doctor_json="$(docker run --rm --read-only "$image" doctor --json)"
          echo "$doctor_json"
          printf '%s\n' "$doctor_json" | cargo run -p vogon-xtask -- check-doctor-json
          providers_json="$(docker run --rm --read-only "$image" providers --json)"
          echo "$providers_json"
          printf '%s\n' "$providers_json" | cargo run -p vogon-xtask -- check-providers-json
          mkdir -p "${{ runner.temp }}/vogon-container-smoke"
          chmod 777 "${{ runner.temp }}/vogon-container-smoke"
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-container-smoke:/work" "$image" init --force --output /work/starter.toml
          init_check_json="$(docker run --rm --read-only -v "${{ runner.temp }}/vogon-container-smoke:/work:ro" "$image" check --json /work/starter.toml)"
          echo "$init_check_json"
          printf '%s\n' "$init_check_json" | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
          check_json="$(docker run --rm --read-only -v "${{ github.workspace }}:/work:ro" "$image" check --json fixtures/workflows/support-triage.toml)"
          echo "$check_json"
          printf '%s\n' "$check_json" | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name support-triage --expected-step-count 2
          verify_json="$(docker run --rm --read-only -v "${{ github.workspace }}:/work:ro" "$image" verify --json fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json)"
          echo "$verify_json"
          printf '%s\n' "$verify_json" | cargo run -p vogon-xtask -- check-verify-json --expected-workflow-name support-triage --expect-match
          trace_jsonl="$(docker run --rm --read-only -v "${{ github.workspace }}:/work:ro" "$image" trace --jsonl fixtures/replays/support-triage.replay.json)"
          echo "$trace_jsonl"
          printf '%s\n' "$trace_jsonl" | python3 scripts/check_trace_jsonl.py --expected-provider deterministic --expected-model deterministic-echo --expected-step-count 2
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-container-smoke:/work" "$image" run --cache-file /work/cache-smoke.cache.json --cache-max-entries 1 /work/starter.toml > "${{ runner.temp }}/vogon-container-smoke/cache-smoke.replay.json"
          python3 scripts/check_cache_json.py "${{ runner.temp }}/vogon-container-smoke/cache-smoke.cache.json" --expected-max-entries 1 --expected-entry-count 1

      - name: Package container image
        run: |
          docker save "vogon-runtime:${{ github.ref_name }}" | gzip > "vogon-${{ github.ref_name }}-container-image.tar.gz"
          sha256sum "vogon-${{ github.ref_name }}-container-image.tar.gz" > "vogon-${{ github.ref_name }}-container-image.tar.gz.sha256"
          cargo run -p vogon-xtask -- check-sha256-file "vogon-${{ github.ref_name }}-container-image.tar.gz"

      - name: Smoke test packaged image archive
        run: |
          image="vogon-runtime:${{ github.ref_name }}"
          sha256sum -c "vogon-${{ github.ref_name }}-container-image.tar.gz.sha256"
          gzip -t "vogon-${{ github.ref_name }}-container-image.tar.gz"
          docker load --input "vogon-${{ github.ref_name }}-container-image.tar.gz"
          python3 scripts/check_container_image.py "$image" --expected-version "${{ github.ref_name }}" --expected-revision "${{ github.sha }}"
          docker run --rm "$image" --version
          docker run --rm --read-only "$image" --version
          docker run --rm --read-only "$image" doctor --json | cargo run -p vogon-xtask -- check-doctor-json
          docker run --rm --read-only "$image" providers --json | cargo run -p vogon-xtask -- check-providers-json
          mkdir -p "${{ runner.temp }}/vogon-packaged-container-smoke"
          chmod 777 "${{ runner.temp }}/vogon-packaged-container-smoke"
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-packaged-container-smoke:/work" "$image" init --force --output /work/starter.toml
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-packaged-container-smoke:/work:ro" "$image" check --json /work/starter.toml | cargo run -p vogon-xtask -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-packaged-container-smoke:/work" "$image" run --cache-file /work/cache-smoke.cache.json --cache-max-entries 1 /work/starter.toml > "${{ runner.temp }}/vogon-packaged-container-smoke/cache-smoke.replay.json"
          python3 scripts/check_cache_json.py "${{ runner.temp }}/vogon-packaged-container-smoke/cache-smoke.cache.json" --expected-max-entries 1 --expected-entry-count 1

      - name: Attest container image archive
        uses: actions/attest@v4
        with:
          subject-path: vogon-${{ github.ref_name }}-container-image.tar.gz

      - name: Upload container image artifact
        uses: actions/upload-artifact@v7
        with:
          name: vogon-container-image
          path: |
            vogon-${{ github.ref_name }}-container-image.tar.gz
            vogon-${{ github.ref_name }}-container-image.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release-artifact-smoke:
    name: Release artifact download smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - linux-cli
      - windows-cli
      - container-image

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Verify downloaded artifact checksums
        run: |
          test -f "release-artifacts/vogon-linux-x86_64/vogon-${{ github.ref_name }}-linux-x86_64.tar.gz"
          test -f "release-artifacts/vogon-linux-x86_64/vogon-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256"
          test -f "release-artifacts/vogon-linux-x86_64/vogon-${{ github.ref_name }}-cargo-metadata.json"
          test -f "release-artifacts/vogon-linux-x86_64/vogon-${{ github.ref_name }}-cargo-metadata.json.sha256"
          test -f "release-artifacts/vogon-linux-x86_64/vogon-${{ github.ref_name }}-cargo-spdx.json"
          test -f "release-artifacts/vogon-linux-x86_64/vogon-${{ github.ref_name }}-cargo-spdx.json.sha256"
          test -f "release-artifacts/vogon-windows-x86_64/vogon-${{ github.ref_name }}-windows-x86_64.zip"
          test -f "release-artifacts/vogon-windows-x86_64/vogon-${{ github.ref_name }}-windows-x86_64.zip.sha256"
          test -f "release-artifacts/vogon-container-image/vogon-${{ github.ref_name }}-container-image.tar.gz"
          test -f "release-artifacts/vogon-container-image/vogon-${{ github.ref_name }}-container-image.tar.gz.sha256"
          (
            cd release-artifacts/vogon-linux-x86_64
            sha256sum -c "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256"
            sha256sum -c "vogon-${{ github.ref_name }}-cargo-metadata.json.sha256"
            sha256sum -c "vogon-${{ github.ref_name }}-cargo-spdx.json.sha256"
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-sha256-file "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz"
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-sha256-file "vogon-${{ github.ref_name }}-cargo-metadata.json"
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-sha256-file "vogon-${{ github.ref_name }}-cargo-spdx.json"
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-cargo-metadata-json "vogon-${{ github.ref_name }}-cargo-metadata.json" --expected-workspace-package vogon-core --expected-workspace-package vogon-adapters --expected-workspace-package vogon-cli
            python3 "$GITHUB_WORKSPACE/scripts/check_spdx_sbom_json.py" "vogon-${{ github.ref_name }}-cargo-spdx.json" --expected-name "vogon-runtime ${{ github.ref_name }}" --expected-package vogon-runtime-source --expected-package vogon-core --expected-package vogon-adapters --expected-package vogon-cli
            mkdir -p linux-archive-smoke
            tar -xzf "vogon-${{ github.ref_name }}-linux-x86_64.tar.gz" -C linux-archive-smoke
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-archive-contents linux-archive-smoke --binary vogon
          )
          (
            cd release-artifacts/vogon-windows-x86_64
            sha256sum -c "vogon-${{ github.ref_name }}-windows-x86_64.zip.sha256"
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-sha256-file "vogon-${{ github.ref_name }}-windows-x86_64.zip"
            mkdir -p windows-archive-smoke
            unzip -q "vogon-${{ github.ref_name }}-windows-x86_64.zip" -d windows-archive-smoke
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-archive-contents windows-archive-smoke --binary vogon.exe
          )
          (
            cd release-artifacts/vogon-container-image
            image="vogon-runtime:${{ github.ref_name }}"
            sha256sum -c "vogon-${{ github.ref_name }}-container-image.tar.gz.sha256"
            cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-sha256-file "vogon-${{ github.ref_name }}-container-image.tar.gz"
            gzip -t "vogon-${{ github.ref_name }}-container-image.tar.gz"
            docker load --input "vogon-${{ github.ref_name }}-container-image.tar.gz"
            python3 "$GITHUB_WORKSPACE/scripts/check_container_image.py" "$image" --expected-version "${{ github.ref_name }}" --expected-revision "${{ github.sha }}"
            docker run --rm "$image" --version
            docker run --rm --read-only "$image" --version
            docker run --rm --read-only "$image" doctor --json | cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-doctor-json
            docker run --rm --read-only "$image" providers --json | cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-providers-json
            mkdir -p "${{ runner.temp }}/vogon-downloaded-container-smoke"
            chmod 777 "${{ runner.temp }}/vogon-downloaded-container-smoke"
            docker run --rm --read-only -v "${{ runner.temp }}/vogon-downloaded-container-smoke:/work" "$image" init --force --output /work/starter.toml
            docker run --rm --read-only -v "${{ runner.temp }}/vogon-downloaded-container-smoke:/work:ro" "$image" check --json /work/starter.toml | cargo run --manifest-path "$GITHUB_WORKSPACE/crates/vogon-xtask/Cargo.toml" -- check-workflow-json --expected-workflow-name starter-workflow --expected-step-count 2
            docker run --rm --read-only -v "${{ runner.temp }}/vogon-downloaded-container-smoke:/work" "$image" run --cache-file /work/cache-smoke.cache.json --cache-max-entries 1 /work/starter.toml > "${{ runner.temp }}/vogon-downloaded-container-smoke/cache-smoke.replay.json"
            python3 "$GITHUB_WORKSPACE/scripts/check_cache_json.py" "${{ runner.temp }}/vogon-downloaded-container-smoke/cache-smoke.cache.json" --expected-max-entries 1 --expected-entry-count 1
          )

  publish-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    needs:
      - linux-cli
      - windows-cli
      - container-image

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/**/vogon-* --title "${{ github.ref_name }}" --generate-notes
