name: Live Hugging Face Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Hugging Face model name.
        required: false
        default: openai/gpt-oss-120b:fastest
  workflow_call:
    inputs:
      model:
        type: string
        required: false
        default: openai/gpt-oss-120b:fastest
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: 10

jobs:
  live-hugging-face:
    name: Live Hugging Face provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI
        run: cargo build --release -p vogon-cli --locked

      - name: Run Hugging Face workflow smoke
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN is required for the live Hugging Face smoke workflow." >&2
            exit 1
          fi

          model="${HUGGING_FACE_MODEL:-openai/gpt-oss-120b:fastest}"
          export HUGGING_FACE_MODEL="$model"

          ./target/release/vogon run \
            --provider hugging-face \
            --hugging-face-model "$model" \
            --hugging-face-timeout-seconds 60 \
            --hugging-face-max-retries 2 \
            --redact-env hf_token=HF_TOKEN \
            --output target/live-hugging-face-smoke.replay.json \
            fixtures/workflows/support-triage.toml

          cargo run -p vogon-xtask -- check-live-replay \
            --replay target/live-hugging-face-smoke.replay.json \
            --provider hugging-face \
            --model "$model" \
            --expected-workflow support-triage \
            --expected-step classify \
            --expected-step draft_response \
            --secret-env HF_TOKEN
