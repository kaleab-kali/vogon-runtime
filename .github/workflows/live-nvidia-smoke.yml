name: Live NVIDIA Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: NVIDIA API Catalog model name.
        required: false
        default: meta/llama-3.1-8b-instruct
  workflow_call:
    inputs:
      model:
        type: string
        required: false
        default: meta/llama-3.1-8b-instruct
    secrets:
      NVIDIA_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: 10

jobs:
  live-nvidia:
    name: Live NVIDIA provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI
        run: cargo build --release -p vogon-cli --locked

      - name: Run NVIDIA workflow smoke
        run: |
          if [ -z "${NVIDIA_API_KEY:-}" ]; then
            echo "NVIDIA_API_KEY is required for the live NVIDIA smoke workflow." >&2
            exit 1
          fi

          model="${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}"
          export NVIDIA_MODEL="$model"

          ./target/release/vogon run \
            --provider nvidia \
            --nvidia-model "$model" \
            --nvidia-timeout-seconds 60 \
            --nvidia-max-retries 2 \
            --redact-env nvidia_api_key=NVIDIA_API_KEY \
            --output target/live-nvidia-smoke.replay.json \
            fixtures/workflows/support-triage.toml

          cargo run -p vogon-xtask -- check-live-replay \
            --replay target/live-nvidia-smoke.replay.json \
            --provider nvidia \
            --model "$model" \
            --expected-workflow support-triage \
            --expected-step classify \
            --expected-step draft_response \
            --secret-env NVIDIA_API_KEY
