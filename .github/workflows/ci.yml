name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Benchmark smoke
        run: cargo bench -p vogon-core --bench runtime -- --iterations 100

      - name: Build release artifacts
        run: cargo build --release --workspace --all-features

      - name: Smoke test release CLI
        run: |
          ./target/release/vogon --version
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            ./target/release/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Smoke test cargo install
        run: |
          cargo install --path crates/vogon-cli --locked --offline --root target/install-smoke --force
          target/install-smoke/bin/vogon --version

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Package
        run: cargo package --workspace --allow-dirty --no-verify

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test with Rust 1.85.0
        run: cargo +1.85.0 test --workspace --all-features --locked

  windows-release-smoke:
    name: Windows release smoke
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test release CLI
        run: |
          .\target\release\vogon.exe --version
          Get-ChildItem fixtures\replays\*.replay.json | ForEach-Object {
            $name = $_.Name -replace '\.replay\.json$', ''
            .\target\release\vogon.exe verify "fixtures\workflows\$name.toml" $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
