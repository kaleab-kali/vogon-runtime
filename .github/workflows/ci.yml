name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: rustup show

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Benchmark smoke
        run: cargo bench -p vogon-core --bench runtime -- --iterations 100

      - name: Build release artifacts
        run: cargo build --release --workspace --all-features

      - name: Smoke test release CLI
        run: |
          ./target/release/vogon --version
          ./target/release/vogon verify fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json

      - name: Smoke test cargo install
        run: |
          cargo install --path crates/vogon-cli --locked --root target/install-smoke --force
          target/install-smoke/bin/vogon --version

      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps

      - name: Package
        run: cargo package --workspace --allow-dirty --no-verify
