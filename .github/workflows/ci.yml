name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Test release scripts
        run: |
          python3 -m unittest scripts.test_write_spdx_sbom
          python3 -m unittest scripts.test_check_cargo_metadata_json
          python3 -m unittest scripts.test_check_spdx_sbom_json
          python3 -m unittest scripts.test_check_sha256_file
          python3 -m unittest scripts.test_check_archive_contents
          python3 -m unittest scripts.test_check_container_image

      - name: Check Cargo manifests
        run: cargo run -p vogon-xtask -- check-cargo-manifests --root .

      - name: Check changelog
        run: cargo run -p vogon-xtask -- check-changelog --root .

      - name: Check contributing checklist
        run: cargo run -p vogon-xtask -- check-contributing-checklist --root .

      - name: Check pull request template
        run: cargo run -p vogon-xtask -- check-pr-template --root .

      - name: Check documentation links
        run: |
          python3 -m unittest scripts.test_check_docs_links
          python3 scripts/check_docs_links.py --root .

      - name: Check public status docs
        run: |
          python3 -m unittest scripts.test_check_public_status_docs
          python3 scripts/check_public_status_docs.py --root .

      - name: Test doctor JSON validator
        run: python3 -m unittest scripts.test_check_doctor_json

      - name: Test providers JSON validator
        run: python3 -m unittest scripts.test_check_providers_json

      - name: Test cache JSON validator
        run: python3 -m unittest scripts.test_check_cache_json

      - name: Test workflow check JSON validator
        run: python3 -m unittest scripts.test_check_workflow_json

      - name: Test verify JSON validator
        run: python3 -m unittest scripts.test_check_verify_json

      - name: Test trace JSONL validator
        run: python3 -m unittest scripts.test_check_trace_jsonl

      - name: Check deployment checklist
        run: |
          python3 -m unittest scripts.test_check_deployment_checklist
          python3 scripts/check_deployment_checklist.py --root .

      - name: Check deployment docs
        run: |
          python3 -m unittest scripts.test_check_deployment_docs
          python3 scripts/check_deployment_docs.py --root .

      - name: Check issue templates
        run: |
          python3 -m unittest scripts.test_check_issue_templates
          python3 scripts/check_issue_templates.py --root .

      - name: Check schema files
        run: |
          python3 -m unittest scripts.test_check_schema_files
          python3 scripts/check_schema_files.py --root .

      - name: Check release checklist
        run: cargo run -p vogon-xtask -- check-release-checklist --root .

      - name: Check package verification docs
        run: |
          python3 -m unittest scripts.test_check_package_verification_docs
          python3 scripts/check_package_verification_docs.py --root .

      - name: Check release workflow
        run: |
          python3 -m unittest scripts.test_check_release_workflow
          python3 scripts/check_release_workflow.py --root .

      - name: Check provider env example
        run: cargo run -p vogon-xtask -- check-env-example --root .

      - name: Check container policy
        run: |
          python3 -m unittest scripts.test_check_container_policy
          python3 scripts/check_container_policy.py --root .

      - name: Check Dependabot configuration
        run: |
          python3 -m unittest scripts.test_check_dependabot_config
          python3 scripts/check_dependabot_config.py --root .

      - name: Check committed secret patterns
        run: |
          python3 -m unittest scripts.test_check_secrets
          python3 scripts/check_secrets.py --root .

      - name: Check CI workflow
        run: |
          python3 -m unittest scripts.test_check_ci_workflow
          python3 scripts/check_ci_workflow.py --root .

      - name: Check GitHub workflow policies
        run: |
          python3 -m unittest scripts.test_check_workflow_policies
          python3 scripts/check_workflow_policies.py --root .

      - name: Check security workflows
        run: |
          python3 -m unittest scripts.test_check_security_workflows
          python3 scripts/check_security_workflows.py --root .

      - name: Check live provider smoke workflows
        run: |
          python3 -m unittest scripts.test_check_live_workflows
          python3 scripts/check_live_workflows.py --root .

      - name: Test live provider replay validator
        run: python3 -m unittest scripts.test_check_live_replay

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Check deterministic-only CLI build
        run: cargo check -p vogon-cli --no-default-features --locked

      - name: Benchmark smoke
        run: |
          python3 -m unittest scripts.test_check_benchmark_output
          benchmark_output="$(cargo bench -p vogon-core --bench runtime --locked -- --iterations 100)"
          echo "$benchmark_output"
          printf '%s\n' "$benchmark_output" | python3 scripts/check_benchmark_output.py --expected-iterations 100

      - name: Build release artifacts
        run: cargo build --release --workspace --all-features --locked

      - name: Smoke test release CLI
        run: |
          ./target/release/vogon --version
          doctor_json="$(./target/release/vogon doctor --json)"
          echo "$doctor_json"
          printf '%s\n' "$doctor_json" | python3 scripts/check_doctor_json.py
          providers_json="$(./target/release/vogon providers --json)"
          echo "$providers_json"
          printf '%s\n' "$providers_json" | python3 scripts/check_providers_json.py
          init_workflow="$RUNNER_TEMP/vogon-init-smoke.toml"
          ./target/release/vogon init --force --output "$init_workflow"
          init_check_json="$(./target/release/vogon check --json "$init_workflow")"
          echo "$init_check_json"
          printf '%s\n' "$init_check_json" | python3 scripts/check_workflow_json.py --expected-workflow-name starter-workflow --expected-step-count 2
          check_json="$(./target/release/vogon check --json fixtures/workflows/support-triage.toml)"
          echo "$check_json"
          printf '%s\n' "$check_json" | python3 scripts/check_workflow_json.py --expected-workflow-name support-triage --expected-step-count 2
          verify_json="$(./target/release/vogon verify --json fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json)"
          echo "$verify_json"
          printf '%s\n' "$verify_json" | python3 scripts/check_verify_json.py --expected-workflow-name support-triage --expect-match
          trace_jsonl="$(./target/release/vogon trace --jsonl fixtures/replays/support-triage.replay.json)"
          echo "$trace_jsonl"
          printf '%s\n' "$trace_jsonl" | python3 scripts/check_trace_jsonl.py --expected-provider deterministic --expected-model deterministic-echo --expected-step-count 2
          cache_file="$RUNNER_TEMP/vogon-cache-smoke.cache.json"
          ./target/release/vogon run --cache-file "$cache_file" --cache-max-entries 1 fixtures/workflows/support-triage.toml > "$RUNNER_TEMP/vogon-cache-smoke.replay.json"
          python3 scripts/check_cache_json.py "$cache_file" --expected-max-entries 1 --expected-entry-count 1
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            ./target/release/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Smoke test cargo install
        run: |
          cargo install --path crates/vogon-cli --locked --offline --root target/install-smoke --force
          target/install-smoke/bin/vogon --version
          target/install-smoke/bin/vogon doctor --json | python3 scripts/check_doctor_json.py
          target/install-smoke/bin/vogon providers --json | python3 scripts/check_providers_json.py
          target/install-smoke/bin/vogon init --force --output target/install-smoke-workflow.toml
          target/install-smoke/bin/vogon check --json target/install-smoke-workflow.toml | python3 scripts/check_workflow_json.py --expected-workflow-name starter-workflow --expected-step-count 2
          target/install-smoke/bin/vogon check --json fixtures/workflows/support-triage.toml | python3 scripts/check_workflow_json.py --expected-workflow-name support-triage --expected-step-count 2
          target/install-smoke/bin/vogon run --cache-file target/install-smoke.cache.json --cache-max-entries 1 fixtures/workflows/support-triage.toml > target/install-smoke.replay.json
          python3 scripts/check_cache_json.py target/install-smoke.cache.json --expected-max-entries 1 --expected-entry-count 1
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            target/install-smoke/bin/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Package
        run: |
          cargo package -p vogon-core --allow-dirty --offline --locked
          cargo package --workspace --allow-dirty --no-verify --offline --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test with Rust 1.85.0
        run: cargo +1.85.0 test --workspace --all-features --locked

  container-smoke:
    name: Container image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build --tag vogon-runtime:ci .

      - name: Smoke test container CLI
        run: |
          image="vogon-runtime:ci"
          python3 scripts/check_container_image.py "$image"
          docker run --rm "$image" --version
          docker run --rm --read-only "$image" --version
          doctor_json="$(docker run --rm --read-only "$image" doctor --json)"
          echo "$doctor_json"
          printf '%s\n' "$doctor_json" | python3 scripts/check_doctor_json.py
          providers_json="$(docker run --rm --read-only "$image" providers --json)"
          echo "$providers_json"
          printf '%s\n' "$providers_json" | python3 scripts/check_providers_json.py
          mkdir -p "${{ runner.temp }}/vogon-container-smoke"
          chmod 777 "${{ runner.temp }}/vogon-container-smoke"
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-container-smoke:/work" "$image" init --force --output /work/starter.toml
          init_check_json="$(docker run --rm --read-only -v "${{ runner.temp }}/vogon-container-smoke:/work:ro" "$image" check --json /work/starter.toml)"
          echo "$init_check_json"
          printf '%s\n' "$init_check_json" | python3 scripts/check_workflow_json.py --expected-workflow-name starter-workflow --expected-step-count 2
          check_json="$(docker run --rm --read-only -v "${{ github.workspace }}:/work:ro" "$image" check --json fixtures/workflows/support-triage.toml)"
          echo "$check_json"
          printf '%s\n' "$check_json" | python3 scripts/check_workflow_json.py --expected-workflow-name support-triage --expected-step-count 2
          verify_json="$(docker run --rm --read-only -v "${{ github.workspace }}:/work:ro" "$image" verify --json fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json)"
          echo "$verify_json"
          printf '%s\n' "$verify_json" | python3 scripts/check_verify_json.py --expected-workflow-name support-triage --expect-match
          trace_jsonl="$(docker run --rm --read-only -v "${{ github.workspace }}:/work:ro" "$image" trace --jsonl fixtures/replays/support-triage.replay.json)"
          echo "$trace_jsonl"
          printf '%s\n' "$trace_jsonl" | python3 scripts/check_trace_jsonl.py --expected-provider deterministic --expected-model deterministic-echo --expected-step-count 2
          docker run --rm --read-only -v "${{ runner.temp }}/vogon-container-smoke:/work" "$image" run --cache-file /work/cache-smoke.cache.json --cache-max-entries 1 /work/starter.toml > "${{ runner.temp }}/vogon-container-smoke/cache-smoke.replay.json"
          python3 scripts/check_cache_json.py "${{ runner.temp }}/vogon-container-smoke/cache-smoke.cache.json" --expected-max-entries 1 --expected-entry-count 1

  windows-release-smoke:
    name: Windows release smoke
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test release CLI
        run: |
          .\target\release\vogon.exe --version
          $doctorJson = (& .\target\release\vogon.exe doctor --json) -join "`n"
          $doctorJson
          $doctorJson | python scripts\check_doctor_json.py
          $providersJson = (& .\target\release\vogon.exe providers --json) -join "`n"
          $providersJson
          $providersJson | python scripts\check_providers_json.py
          $initWorkflow = Join-Path $env:RUNNER_TEMP 'vogon-init-smoke.toml'
          .\target\release\vogon.exe init --force --output $initWorkflow
          $initCheckJson = (& .\target\release\vogon.exe check --json $initWorkflow) -join "`n"
          $initCheckJson
          $initCheckJson | python scripts\check_workflow_json.py --expected-workflow-name starter-workflow --expected-step-count 2
          $checkJson = (& .\target\release\vogon.exe check --json fixtures\workflows\support-triage.toml) -join "`n"
          $checkJson
          $checkJson | python scripts\check_workflow_json.py --expected-workflow-name support-triage --expected-step-count 2
          $verifyJson = (& .\target\release\vogon.exe verify --json fixtures\workflows\support-triage.toml fixtures\replays\support-triage.replay.json) -join "`n"
          $verifyJson
          $verifyJson | python scripts\check_verify_json.py --expected-workflow-name support-triage --expect-match
          $traceJsonl = (& .\target\release\vogon.exe trace --jsonl fixtures\replays\support-triage.replay.json) -join "`n"
          $traceJsonl
          $traceJsonl | python scripts\check_trace_jsonl.py --expected-provider deterministic --expected-model deterministic-echo --expected-step-count 2
          $cacheFile = Join-Path $env:RUNNER_TEMP 'vogon-cache-smoke.cache.json'
          .\target\release\vogon.exe run --cache-file $cacheFile --cache-max-entries 1 fixtures\workflows\support-triage.toml | Out-Null
          python scripts\check_cache_json.py $cacheFile --expected-max-entries 1 --expected-entry-count 1
          Get-ChildItem fixtures\replays\*.replay.json | ForEach-Object {
            $name = $_.Name -replace '\.replay\.json$', ''
            .\target\release\vogon.exe verify "fixtures\workflows\$name.toml" $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
