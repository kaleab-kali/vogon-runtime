name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_NET_RETRY: 10

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: rustup show

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Test release scripts
        run: python3 -m unittest scripts.test_write_spdx_sbom

      - name: Check documentation links
        run: |
          python3 -m unittest scripts.test_check_docs_links
          python3 scripts/check_docs_links.py --root .

      - name: Check provider env example
        run: |
          python3 -m unittest scripts.test_check_env_example
          python3 scripts/check_env_example.py --root .

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Check deterministic-only CLI build
        run: cargo check -p vogon-cli --no-default-features

      - name: Benchmark smoke
        run: cargo bench -p vogon-core --bench runtime -- --iterations 100

      - name: Build release artifacts
        run: cargo build --release --workspace --all-features

      - name: Smoke test release CLI
        run: |
          ./target/release/vogon --version
          check_json="$(./target/release/vogon check --json fixtures/workflows/support-triage.toml)"
          echo "$check_json"
          printf '%s\n' "$check_json" | python3 -c "import json, sys; data = json.load(sys.stdin); assert data['workflow_name'] == 'support-triage'; assert data['step_count'] == 2"
          verify_json="$(./target/release/vogon verify --json fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json)"
          echo "$verify_json"
          printf '%s\n' "$verify_json" | python3 -c "import json, sys; data = json.load(sys.stdin); assert data['workflow_name'] == 'support-triage'; assert data['is_match'] is True; assert data['mismatches'] == []"
          trace_jsonl="$(./target/release/vogon trace --jsonl fixtures/replays/support-triage.replay.json)"
          echo "$trace_jsonl"
          printf '%s\n' "$trace_jsonl" | python3 -c "import json, sys; first = json.loads(sys.stdin.readline()); assert first['event'] == 'run'; assert first['schema_version'] == 1; assert first['runtime']['provider'] == 'deterministic'; assert first['runtime']['model'] == 'deterministic-echo'"
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            ./target/release/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Smoke test cargo install
        run: |
          cargo install --path crates/vogon-cli --locked --offline --root target/install-smoke --force
          target/install-smoke/bin/vogon --version
          target/install-smoke/bin/vogon check --json fixtures/workflows/support-triage.toml
          for replay in fixtures/replays/*.replay.json; do
            name="${replay##*/}"
            name="${name%.replay.json}"
            target/install-smoke/bin/vogon verify "fixtures/workflows/${name}.toml" "$replay"
          done

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Package
        run: cargo package --workspace --allow-dirty --no-verify --offline

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.85.0
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test with Rust 1.85.0
        run: cargo +1.85.0 test --workspace --all-features --locked

  container-smoke:
    name: Container image smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build container image
        run: docker build --tag vogon-runtime:ci .

      - name: Smoke test container CLI
        run: |
          docker run --rm vogon-runtime:ci --version
          check_json="$(docker run --rm -v "${{ github.workspace }}:/work" vogon-runtime:ci check --json fixtures/workflows/support-triage.toml)"
          echo "$check_json"
          printf '%s\n' "$check_json" | python3 -c "import json, sys; data = json.load(sys.stdin); assert data['workflow_name'] == 'support-triage'; assert data['step_count'] == 2"
          verify_json="$(docker run --rm -v "${{ github.workspace }}:/work" vogon-runtime:ci verify --json fixtures/workflows/support-triage.toml fixtures/replays/support-triage.replay.json)"
          echo "$verify_json"
          printf '%s\n' "$verify_json" | python3 -c "import json, sys; data = json.load(sys.stdin); assert data['workflow_name'] == 'support-triage'; assert data['is_match'] is True; assert data['mismatches'] == []"
          trace_jsonl="$(docker run --rm -v "${{ github.workspace }}:/work" vogon-runtime:ci trace --jsonl fixtures/replays/support-triage.replay.json)"
          echo "$trace_jsonl"
          printf '%s\n' "$trace_jsonl" | python3 -c "import json, sys; first = json.loads(sys.stdin.readline()); assert first['event'] == 'run'; assert first['schema_version'] == 1; assert first['runtime']['provider'] == 'deterministic'; assert first['runtime']['model'] == 'deterministic-echo'"

  windows-release-smoke:
    name: Windows release smoke
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI artifact
        run: cargo build --release -p vogon-cli --locked

      - name: Smoke test release CLI
        run: |
          .\target\release\vogon.exe --version
          $checkJson = (& .\target\release\vogon.exe check --json fixtures\workflows\support-triage.toml) -join "`n"
          $checkJson
          $check = $checkJson | ConvertFrom-Json
          if ($check.workflow_name -ne 'support-triage' -or $check.step_count -ne 2) {
            throw "Unexpected check JSON output: $checkJson"
          }
          $verifyJson = (& .\target\release\vogon.exe verify --json fixtures\workflows\support-triage.toml fixtures\replays\support-triage.replay.json) -join "`n"
          $verifyJson
          $verify = $verifyJson | ConvertFrom-Json
          if ($verify.workflow_name -ne 'support-triage' -or -not $verify.is_match -or $verify.mismatches.Count -ne 0) {
            throw "Unexpected verify JSON output: $verifyJson"
          }
          $traceJsonl = (& .\target\release\vogon.exe trace --jsonl fixtures\replays\support-triage.replay.json) -join "`n"
          $traceJsonl
          $traceRun = ($traceJsonl -split "`n")[0] | ConvertFrom-Json
          if ($traceRun.event -ne 'run' -or $traceRun.schema_version -ne 1 -or $traceRun.runtime.provider -ne 'deterministic' -or $traceRun.runtime.model -ne 'deterministic-echo') {
            throw "Unexpected trace JSONL run event: $traceJsonl"
          }
          Get-ChildItem fixtures\replays\*.replay.json | ForEach-Object {
            $name = $_.Name -replace '\.replay\.json$', ''
            .\target\release\vogon.exe verify "fixtures\workflows\$name.toml" $_.FullName
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
