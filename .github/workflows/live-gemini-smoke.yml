name: Live Gemini Smoke

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: 10

jobs:
  live-gemini:
    name: Live Gemini provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI
        run: cargo build --release -p vogon-cli --locked

      - name: Run Gemini workflow smoke
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is required for the live Gemini smoke workflow." >&2
            exit 1
          fi

          ./target/release/vogon run \
            --provider gemini \
            --gemini-timeout-seconds 60 \
            --gemini-max-retries 2 \
            --redact gemini_api_key="$GEMINI_API_KEY" \
            --output target/live-gemini-smoke.replay.json \
            fixtures/workflows/support-triage.toml

          cargo run -p vogon-xtask -- check-live-replay \
            --replay target/live-gemini-smoke.replay.json \
            --provider gemini \
            --model gemini-3.1-flash-lite \
            --secret-env GEMINI_API_KEY
