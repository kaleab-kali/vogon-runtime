name: Live OpenRouter Smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenRouter model name.
        required: false
        default: openrouter/free
  workflow_call:
    inputs:
      model:
        type: string
        required: false
        default: openrouter/free
    secrets:
      OPENROUTER_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_NET_RETRY: 10

jobs:
  live-openrouter:
    name: Live OpenRouter provider
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Build CLI
        run: cargo build --release -p vogon-cli --locked

      - name: Run OpenRouter workflow smoke
        run: |
          if [ -z "${OPENROUTER_API_KEY:-}" ]; then
            echo "OPENROUTER_API_KEY is required for the live OpenRouter smoke workflow." >&2
            exit 1
          fi

          model="${OPENROUTER_MODEL:-openrouter/free}"
          export OPENROUTER_MODEL="$model"

          ./target/release/vogon run \
            --provider openrouter \
            --openrouter-model "$model" \
            --openrouter-timeout-seconds 60 \
            --openrouter-max-retries 2 \
            --redact-env openrouter_api_key=OPENROUTER_API_KEY \
            --output target/live-openrouter-smoke.replay.json \
            fixtures/workflows/support-triage.toml

          cargo run -p vogon-xtask -- check-live-replay \
            --replay target/live-openrouter-smoke.replay.json \
            --provider openrouter \
            --model "$model" \
            --expected-workflow support-triage \
            --expected-step classify \
            --expected-step draft_response \
            --secret-env OPENROUTER_API_KEY
