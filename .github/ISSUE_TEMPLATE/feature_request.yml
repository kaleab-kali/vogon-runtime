name: Feature request
description: Propose an improvement to Vogon Runtime.
title: "Feature: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this form for workflow runtime, replay, provider adapter, CLI, documentation, or release process improvements.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or operational problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Runtime
        - Replay verification
        - Provider adapter
        - Documentation
        - Release artifact
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other designs you considered.
    validations:
      required: false
  - type: textarea
    id: examples
    attributes:
      label: Example usage
      description: Include commands, workflow snippets, replay examples, or API sketches if useful.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have removed secrets, API keys, private prompts, and sensitive replay data.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
