[package]
name = "vogon-adapters"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Model adapters for Vogon Runtime."
readme = "../../README.md"
keywords = ["ai", "model-adapters", "workflow", "runtime"]
categories = ["development-tools"]

[lints]
workspace = true

[features]
default = ["gemini", "openai-compatible"]
gemini = ["dep:serde", "dep:serde_json", "dep:ureq"]
openai-compatible = ["dep:serde", "dep:serde_json", "dep:ureq"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
vogon-core.workspace = true

[dev-dependencies]
serde_json.workspace = true
