[package]
name = "vogon-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
description = "Command-line interface for Vogon Runtime."
readme = "../../README.md"
keywords = ["ai", "workflow", "replay", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["gemini"]
gemini = ["vogon-adapters/gemini"]

[[bin]]
name = "vogon"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
toml.workspace = true
vogon-adapters.workspace = true
vogon-core.workspace = true
