[workspace]
resolver = "3"
members = [
    "crates/vogon-adapters",
    "crates/vogon-cli",
    "crates/vogon-core",
    "crates/vogon-xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/kaleab-kali/vogon-runtime"
homepage = "https://github.com/kaleab-kali/vogon-runtime"
documentation = "https://github.com/kaleab-kali/vogon-runtime/tree/main/docs"
authors = ["Vogon Runtime Contributors"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
httpdate = "1.0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
toml = "1.1"
# Keep ureq's optional JSON/default features disabled; adapters use serde_json
# directly so unused optional HTTP dependencies do not enter Cargo.lock.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
vogon-adapters = { version = "0.2.0", path = "crates/vogon-adapters", default-features = false }
vogon-core = { version = "0.2.0", path = "crates/vogon-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
